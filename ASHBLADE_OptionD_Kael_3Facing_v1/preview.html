<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kael - Option D Facing Preview</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif} body{background:#10101b;color:#e9e1f4;max-width:1080px;margin:20px auto;padding:20px}h1{margin:0} p{color:#afa9c9}label{display:inline-flex;align-items:center;gap:8px;margin:10px}select,button{background:#27223d;color:#fff;border:1px solid #736293;border-radius:6px;padding:8px} canvas{image-rendering:pixelated;background:repeating-conic-gradient(#242039 0 25%,#34304a 0 50%) 50% / 24px 24px;border:1px solid #77628e;display:block;width:512px;height:384px;max-width:90vw} .row{display:flex;gap:30px;flex-wrap:wrap;align-items:center}small{color:#a8abc2}
</style><h1>Kael — Option D · Soul Knight 3-Facing</h1><p>This is an art/animation atlas preview, not a replacement for end-to-end gameplay QA. No Up/back-facing pose is used.</p>
<div class="row"><div><label>Visual facing <select id="dir"><option value="center">Center (front)</option><option value="left">Left (mirrored)</option><option value="right">Right</option></select></label><label>Animation <select id="anim"></select></label><label><input id="play" type="checkbox" checked> Play</label></div><canvas id="screen" width="128" height="96"></canvas></div><p><small>WASD: change facing to left/center/right (W/S -> center); J/K: animation previous/next. Aim & movement physics are not simulated here.</small></p>
<script>
const count={entrance:8,idle:8,walk:8,run:8,attack1:8,attack2:8,attack3:8,skill1:8,skill2:8,ultimate:10,dash:6,hit:4,death:8};
const names=Object.keys(count),dir=document.getElementById('dir'),anim=document.getElementById('anim'),play=document.getElementById('play'),canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
for(const name of names){const o=document.createElement('option');o.value=name;o.textContent=name+' ('+count[name]+')';anim.append(o)};anim.value='idle';
const img={};for(const k of ['center','right']){img[k]=new Image();img[k].src='assets/kael-'+k+'.png'}
let frame=0,last=0;function draw(t){let a=anim.value,k=dir.value,idx=names.indexOf(a),n=count[a],fps=['idle','walk'].includes(a)?9:13;
 if(play.checked && t-last>1000/fps){frame=(frame+1)%n;last=t};ctx.clearRect(0,0,128,96);
 const src=img[k==='center'?'center':'right'];if(src.complete&&src.naturalWidth){ctx.save();if(k==='left'){ctx.translate(128,0);ctx.scale(-1,1)}ctx.drawImage(src,frame*128,idx*96,128,96,0,0,128,96);ctx.restore()}
 requestAnimationFrame(draw)}requestAnimationFrame(draw);
anim.addEventListener('change',()=>{frame=0});document.addEventListener('keydown',(e)=>{if(['KeyA','KeyD','KeyW','KeyS'].includes(e.code)){dir.value=e.code==='KeyA'?'left':e.code==='KeyD'?'right':'center';e.preventDefault()}
 if(e.code==='KeyJ'||e.code==='KeyK'){anim.selectedIndex=(anim.selectedIndex+(e.code==='KeyJ'?-1:1)+names.length)%names.length;frame=0;e.preventDefault()}})
</script></html>
